name: Build ESP32-CAM Web
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile Arduino Sketch
        uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32s3:FlashSize=8M,PartitionScheme=default_8MB,PSRAM=opi
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          libraries: |
            - name: Adafruit NeoPixel
          sketch-paths: |
            - 'ESP32_CAM_Web'

      - name: Find and copy bin files
        if: always()
        run: |
          mkdir -p ${{ github.workspace }}/output
          find /home /tmp /root ${{ github.workspace }} -name "*.bin" -type f -exec cp {} ${{ github.workspace }}/output/ \; 2>/dev/null || true
          find /home /tmp /root ${{ github.workspace }} -name "*.elf" -type f -exec cp {} ${{ github.workspace }}/output/ \; 2>/dev/null || true
          ls -la ${{ github.workspace }}/output/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmware
          path: ${{ github.workspace }}/output/
          if-no-files-found: warn
